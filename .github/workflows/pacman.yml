name: Generate Pac-Man Contribution Graph

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-pacman-animation
    steps:
      - uses: actions/checkout@v4

      # Generate Pac-Man SVG
      - uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: keandrezuhdi
          github_token: ${{ secrets.GITHUB_TOKEN }}
          player_style: opportunistic

      # Commit hasil file ke branch main (folder dist)
      - name: Commit and push generated SVG
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add dist/
          git commit -m "chore: update pacman contribution graph" || exit 0
          git push
